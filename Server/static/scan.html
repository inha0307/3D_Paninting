<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스캔 올리기</title>
<style>
  :root { --ink: #1f2430; --quiet: #5b6475; --accent: #2f6fed; --good: #2e9e5b; --bad: #d93a3a; --line: #d7dce5; --bg: #f3f5f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  p.lead { color: var(--quiet); margin: 0 0 24px; font-size: 17px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 18px; margin-bottom: 10px; }
  .ids { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .ids button { height: 52px; font-size: 20px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .ids button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  input[type=file] { font-size: 17px; width: 100%; }
  button.primary { width: 100%; height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-size: 21px; font-weight: 700; }
  button.primary:disabled { opacity: .4; }
  #status { font-size: 19px; min-height: 28px; margin-top: 14px; }
  #status.good { color: var(--good); } #status.bad { color: var(--bad); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--quiet); }
  li:first-child { border-top: 0; }
  li b { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>스캔 올리기</h1>
  <p class="lead">스캔한 물건을 장식으로 쓸 수 있게 운영 PC로 보냅니다. 변환에 몇 초~1분 걸립니다.</p>

  <section>
    <label>1. 학생 번호</label>
    <div class="ids" id="ids"></div>
  </section>

  <section>
    <label for="file">2. 스캔 파일 (USDZ, GLB, OBJ, FBX)</label>
    <input id="file" type="file" accept=".usdz,.usd,.usdc,.glb,.gltf,.obj,.fbx">
  </section>

  <section>
    <button class="primary" id="send" disabled>보내기</button>
    <div id="status"></div>
  </section>

  <section>
    <label>이 학생의 스캔</label>
    <ul id="list"><li>학생 번호를 고르세요.</li></ul>
  </section>
</main>
<script>
  const STUDENTS = 30;
  let studentId = null;
  const ids = document.getElementById("ids"), fileInput = document.getElementById("file");
  const send = document.getElementById("send"), status = document.getElementById("status"), list = document.getElementById("list");

  for (let i = 1; i <= STUDENTS; i++) {
    const b = document.createElement("button");
    b.textContent = i;
    b.onclick = () => { studentId = i; [...ids.children].forEach(c => c.classList.toggle("on", c === b)); refresh(); loadList(); };
    ids.appendChild(b);
  }
  fileInput.onchange = refresh;

  function refresh() { send.disabled = !(studentId && fileInput.files.length); }
  function show(text, kind) { status.textContent = text; status.className = kind || ""; }

  send.onclick = async () => {
    const form = new FormData();
    form.append("id", studentId);
    form.append("file", fileInput.files[0]);
    send.disabled = true;
    show("보내는 중…");
    try {
      const res = await fetch("/api/scans", { method: "POST", body: form });
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || res.status);
      await poll(body.jobId);
    } catch (e) {
      show("보내지 못했어요: " + e.message, "bad");
    }
    refresh();
  };

  async function poll(jobId) {
    for (;;) {
      const job = await (await fetch(`/api/scans/jobs/${jobId}`)).json();
      if (job.status === "queued") show("순서를 기다리는 중…");
      else if (job.status === "converting") show("장식으로 바꾸는 중…");
      else if (job.status === "done") { show("완료! 색칠 앱의 꾸미기에서 쓸 수 있어요.", "good"); fileInput.value = ""; loadList(); return; }
      else { show("변환하지 못했어요. 다시 스캔해 주세요. (" + job.error + ")", "bad"); return; }
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  async function loadList() {
    const { scans } = await (await fetch(`/api/scans?owner=${studentId}`)).json();
    list.innerHTML = scans.length ? "" : "<li>아직 없어요.</li>";
    for (const s of scans) {
      const li = document.createElement("li");
      const [x, y, z] = s.dimensions.map(v => Math.round(v * 100));
      const name = document.createElement("b");
      name.textContent = s.sourceName;   // 파일 이름은 사용자가 정하므로 HTML로 넣지 않음
      li.append(name, ` · ${x}×${y}×${z}cm · 삼각형 ${s.triangles.toLocaleString()}개`);
      list.appendChild(li);
    }
  }
</script>
</body>
</html>
